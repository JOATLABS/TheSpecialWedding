# Ruff configuration for the FastAPI backend (`app/`).
#
# WHY THIS FILE EXISTS
# CI once installed ruff unpinned with no repository config at all. Both halves
# of that were load-bearing: ruff 0.16.0 replaced the old fixed default rule set
# (`["E4", "E7", "E9", "F"]`) with a much larger, version-dependent one, and a
# green backend became 7777 errors overnight with no code change.
#
# Two independent mechanisms keep lint results stable, because neither is
# sufficient alone:
#
#   1. `select` below pins the *rule surface*. `ignore` alone cannot do this --
#      it only subtracts from whatever the installed ruff happens to default to,
#      so a future default expansion would reintroduce the same breakage. The
#      list is the exact set ruff 0.16.0 enables by default; it is enumerated
#      rather than written as prefixes because most prefixes are only partially
#      default-enabled (`S` is 3 of 73 rules, `D` is 1 of 48), so `select = ["S"]`
#      would switch on 70 rules nobody has triaged.
#
#   2. The CI pin (`ruff==0.16.0` in .github/workflows/ci.yml) fixes the rule
#      *implementations*. Ruff can change what an existing rule flags between
#      releases, so an explicit `select` alone still would not make lint
#      reproducible. Bumping that pin is a deliberate, reviewable act.
#
# The 0.16 rules were adopted rather than reverted: ~5,800 modernizations were
# applied (PEP 604/585 typing, f-string conversions, import sorting). The
# `ignore` list below covers what could not be mechanically fixed, each with a
# reason -- these are follow-up work, not permanent exemptions.
#
# To regenerate `select` after an intentional ruff upgrade:
#   ruff check --show-settings --isolated <any-file> \
#     | sed -n '/linter.rules.enabled/,/^]/p' \
#     | grep -oE '\([A-Z]+[0-9]+\)' | tr -d '()' | sort -u

target-version = "py311"

