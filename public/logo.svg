  />

  <!-- Text -->
  <text x="45" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#E8B4B8" letter-spacing="0.5">THE SPECIAL</text>
  <text x="45" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#E8B4B8" letter-spacing="1">WEDDING</text>
