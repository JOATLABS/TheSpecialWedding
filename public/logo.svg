<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B4B8"/>
      <stop offset="100%" style="stop-color:#D4A5A9"/>
    </linearGradient>
  </defs>

  <!-- Rings icon -->
  <g stroke="url(#ringGrad)" stroke-width="2.5" fill="none" transform="translate(5, 10)">
    <circle cx="12" cy="15" r="10"/>
