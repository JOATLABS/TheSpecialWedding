# Nginx configuration for api.thespecialwedding.com
# This file should be copied to /etc/nginx/sites-available/weddingapp-api
# and symlinked to /etc/nginx/sites-enabled/

# HTTP - Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.thespecialwedding.com;

    # Let's Encrypt challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Main API Configuration
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.thespecialwedding.com;

    # SSL Configuration (managed by certbot)
    # These paths will be created automatically by certbot
    ssl_certificate /etc/letsencrypt/live/api.thespecialwedding.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.thespecialwedding.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client Upload Size (for gallery uploads)
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # Logging
    access_log /var/log/nginx/weddingapp-api-access.log;
    error_log /var/log/nginx/weddingapp-api-error.log;

    # Proxy to Docker Compose Nginx Load Balancer
    location / {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;

        # Headers for proper client identification
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (for real-time features if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # SSE (Server-Sent Events) endpoint — needs special proxy settings:
    #   - No buffering so events stream immediately to the client
    #   - Long read timeout (1 hour) because the connection stays open
    #   - Chunked transfer encoding disabled (SSE is not chunked)
    location /admin/notifications/stream {
        proxy_pass http://localhost:8000/admin/notifications/stream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # Critical for SSE: disable all buffering
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Keep the connection open for up to 1 hour (heartbeats keep it alive)
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        # Don't log SSE connections (one per user, very long-lived)
        access_log off;
    }

    # Health check endpoint (don't log)
    location /health/ {
        proxy_pass http://localhost:8000/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Favicon (prevent 404 errors in logs)
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Robots.txt (optional - allow crawlers for API docs)
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }
}
