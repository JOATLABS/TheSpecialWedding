services:
  mongo:
    image: mongo:5.0
    container_name: wedding-mongo
    restart: always
    # DO NOT EXPOSE MongoDB to the internet!
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: wedding

  redis:
    image: redis:7-alpine
    container_name: wedding-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
      - ./.env:/app/.env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Admin setup job - runs once to create admin user
  admin-setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding-admin-setup
    depends_on:
      - mongo
      - api
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /app
    volumes:
      - ./scripts:/app/scripts
      - ./.env:/app/.env
    command: python scripts/setup_admin_user.py --auto-create
    restart: "no"

volumes:
  mongo_data:
  redis_data: