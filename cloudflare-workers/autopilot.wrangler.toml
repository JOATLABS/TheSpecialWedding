# Wrangler configuration for the Autopilot Payment Cron Worker
# This Worker handles automated payment processing for Wedding Finance Autopilot
#
# Deploy with:
# wrangler deploy --config cloudflare-workers/autopilot.wrangler.toml
#
# Set secrets:
# wrangler secret put CRON_SECRET --config cloudflare-workers/autopilot.wrangler.toml

name = "autopilot-cron"
main = "autopilot-cron.js"
compatibility_date = "2024-10-01"

[triggers]
# Process due payments - daily at 9 AM UTC
# Send payment reminders - daily at 10 AM UTC
# Retry failed payments - every 6 hours
crons = ["0 9 * * *", "0 10 * * *", "0 */6 * * *"]

[vars]
# Base URL for the FastAPI backend
API_URL = "https://api.thespecialwedding.com"

# Optional: Email for failure alerts (uses FREE MailChannels)
# ALERT_EMAIL = "admin@thespecialwedding.com"

# Optional: Set to "true" to receive success summary emails
# SEND_SUCCESS_EMAILS = ""

# Note: CRON_SECRET must be set via wrangler secret or Cloudflare dashboard
# wrangler secret put CRON_SECRET --config cloudflare-workers/autopilot.wrangler.toml
