# Wrangler configuration for the Database Backup Cron Worker
# Runs daily at 2:00 AM UTC to trigger MongoDB backup
#
# Deploy with:
# wrangler deploy --config cloudflare-workers/backup.wrangler.toml
#
# Set secrets:
# wrangler secret put BACKUP_SECRET --config cloudflare-workers/backup.wrangler.toml

name = "backup-cron"
main = "backup-cron.js"
compatibility_date = "2024-10-01"

[triggers]
# Daily backup at 2 AM UTC
crons = ["0 2 * * *"]

[vars]
# Base URL for the FastAPI backend
API_URL = "https://api.thespecialwedding.com"

# Optional: Email for backup alerts (uses FREE MailChannels)
# ALERT_EMAIL = "admin@thespecialwedding.com"

# Note: BACKUP_SECRET must be set via wrangler secret or Cloudflare dashboard
# wrangler secret put BACKUP_SECRET --config cloudflare-workers/backup.wrangler.toml
