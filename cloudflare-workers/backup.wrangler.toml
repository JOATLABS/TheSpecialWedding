# Wrangler configuration for the Database Backup Cron Worker
# Runs daily at 2:00 AM UTC to trigger MongoDB backup
#
# Deploy with:
# wrangler deploy --config cloudflare-workers/backup.wrangler.toml
#
# Set secrets:
# wrangler secret put BACKUP_SECRET --config cloudflare-workers/backup.wrangler.toml

name = "backup-cron"
main = "backup-cron.js"
compatibility_date = "2026-04-10"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Daily backup at 2 AM UTC
crons = ["0 2 * * *"]

# All env vars are set via GitHub secrets during deployment (see deploy-workers.yml)
# Required secrets in GitHub: NEXT_PUBLIC_API_BASE_URL, BACKUP_SECRET, RESEND_API_KEY, ALERT_EMAIL, ROOT_ADMIN_EMAIL
