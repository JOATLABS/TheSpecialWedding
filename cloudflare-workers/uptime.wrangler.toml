# Wrangler configuration for the Uptime Monitor Cron Worker
# This Worker monitors backend API health and sends alerts if down
# Uses KV to debounce alerts (max 1 per hour) and track recovery
#
# Deploy with:
# wrangler deploy --config cloudflare-workers/uptime.wrangler.toml
#
# Create KV namespace (run once):
# wrangler kv:namespace create "uptime-state" --config cloudflare-workers/uptime.wrangler.toml
# Then update the id below with the returned namespace ID
#
# Set secrets:
# wrangler secret put RESEND_API_KEY --config cloudflare-workers/uptime.wrangler.toml

name = "uptime-cron"
main = "uptime-cron.js"
compatibility_date = "2024-10-01"

[triggers]
# Check every 5 minutes
crons = ["*/5 * * * *"]

# All env vars are set via GitHub secrets during deployment (see deploy-workers.yml)
# Required secrets in GitHub: NEXT_PUBLIC_API_BASE_URL, RESEND_API_KEY, ALERT_EMAIL, ROOT_ADMIN_EMAIL

# KV namespace for alert debouncing and state tracking
# Create with: wrangler kv:namespace create "uptime-state"
# Then replace <YOUR_KV_NAMESPACE_ID> with the returned ID
[[kv_namespaces]]
binding = "UPTIME_KV"
id = "<YOUR_KV_NAMESPACE_ID>"

# Note: RESEND_API_KEY must be set via wrangler secret or Cloudflare dashboard
# wrangler secret put RESEND_API_KEY --config cloudflare-workers/uptime.wrangler.toml
