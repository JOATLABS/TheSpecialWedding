services:
  mongo:
    image: mongo:5.0
    container_name: wedding-mongo
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: wedding

  api:
    build: .
    container_name: wedding-api
    ports:
      - "8001:8000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./.env:/app/.env
    # Create admin user and start API
    command: |
      sh -c "
        echo 'Setting up admin user...' &&
        python scripts/setup_admin_user.py --auto-create &&
        echo 'Starting API server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Admin GUI - Streamlit-based web interface
  admin-gui:
    image: python:3.11-slim
    container_name: wedding-admin-gui
    depends_on:
      - api
    environment:
      PYTHONPATH: /app
      DOCKER_ENV: "true"
    volumes:
      - ./admin_gui:/app/admin_gui
      - ./.env:/app/.env
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for container management
    ports:
      - "8502:8501"
    # Install dependencies and run Streamlit
    command: |
      sh -c "
        echo 'Installing GUI dependencies...' &&
        pip install --no-cache-dir streamlit==1.44.0 pandas python-dotenv requests docker &&
        echo 'Starting Admin GUI...' &&
        cd /app/admin_gui &&
        python -c 'import time; time.sleep(5)'  &&
        streamlit run --server.headless=true --server.fileWatcherType=none --server.port=8501 --server.address=0.0.0.0 admin_gui.py
      "

volumes:
  mongo_data:
