version: '3.8'

services:
  mongo:
    image: mongo:5.0
    container_name: wedding-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: wedding

  api:
    build: .
    container_name: wedding-api
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://mongo:27017
      PYTHONPATH: /app
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./.env:/app/.env
    # Create admin user and start API
    command: |
      sh -c "
        echo 'Setting up admin user...' &&
        python scripts/setup_admin_user.py --auto-create &&
        echo 'Starting API server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Admin GUI - requires X11 forwarding on Linux
  admin-gui:
    image: python:3.11-slim
    container_name: wedding-admin-gui
    depends_on:
      - api
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: 1
      PYTHONPATH: /app
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./admin_gui:/app/admin_gui
      - ./.env:/app/.env
    network_mode: host
    # Install dependencies and run GUI
    command: |
      sh -c "
        echo 'Installing GUI dependencies...' &&
        apt-get update && apt-get install -y libgl1-mesa-glx libglib2.0-0 libxcb-* libxkbcommon-x11-0 libdbus-1-3 &&
        pip install -r /app/admin_gui/requirements.txt &&
        echo 'Starting Admin GUI...' &&
        cd /app/admin_gui &&
        python admin_gui.py
      "

volumes:
  mongo_data: