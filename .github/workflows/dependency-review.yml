# =============================================================================
# Dependency Review - Blocks PRs that introduce vulnerable dependencies
# Runs on PRs only (especially useful for Dependabot PRs)
# =============================================================================
name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block PRs with known high/critical vulnerabilities
          fail-on-severity: high
          # Comment on PR with vulnerability details
          comment-summary-in-pr: always
          # Also check license compatibility
          deny-licenses: GPL-3.0, AGPL-3.0
