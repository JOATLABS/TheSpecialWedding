# =============================================================================
# Dependency Review - PARKED (2026-04-20)
#
# Removed from automatic PR triggers to cut CI minutes. `security-audit` in
# ci.yml already runs `npm audit --audit-level=high` and `pip-audit` on every
# push/PR, so this action was redundant.
#
# Kept as manual-dispatch only so the workflow and its history remain
# available if you want to re-enable PR gating for Dependabot bumps later.
# To fully delete, run: git rm .github/workflows/dependency-review.yml
# =============================================================================
name: Dependency Review

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          deny-licenses: GPL-3.0, AGPL-3.0
