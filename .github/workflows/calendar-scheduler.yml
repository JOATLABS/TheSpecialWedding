# =============================================================================
# Calendar scheduler workflow
# Uses the environment-scoped SCHEDULER_BASE_URL variable for the target API.
# Staging can be triggered manually for validation, but is not scheduled by
# default.
# =============================================================================
name: Calendar Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Which environment to target"
        required: true
        default: staging
        type: choice
        options:
          - production
          - staging
      job:
        description: "Which calendar scheduler job(s) to run"
        required: true
        default: both
        type: choice
        options:
          - invite
          - maintenance
          - both
      invite_limit:
        description: "Invite-job batch size for manual runs"
        required: false
        default: "25"
      retry_limit:
        description: "Sync-retry batch size for manual runs"
        required: false
        default: "50"
      drift_limit:
        description: "Drift-check batch size for manual runs"
        required: false
        default: "50"

permissions:
  contents: read

jobs:
  production:
    name: Run production calendar scheduler
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name == 'production') }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SCHEDULER_BASE_URL: ${{ vars.SCHEDULER_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve production job plan
        id: plan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "*/5 * * * *")
                echo "run_invites=true" >> "$GITHUB_OUTPUT"
                echo "run_maintenance=false" >> "$GITHUB_OUTPUT"
                echo "invite_limit=25" >> "$GITHUB_OUTPUT"
                echo "retry_limit=50" >> "$GITHUB_OUTPUT"
                echo "drift_limit=50" >> "$GITHUB_OUTPUT"
                ;;
              "*/15 * * * *")
                echo "run_invites=false" >> "$GITHUB_OUTPUT"
                echo "run_maintenance=true" >> "$GITHUB_OUTPUT"
                echo "invite_limit=25" >> "$GITHUB_OUTPUT"
                echo "retry_limit=50" >> "$GITHUB_OUTPUT"
                echo "drift_limit=50" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported schedule trigger: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          else
            case "${{ github.event.inputs.job }}" in
              invite)
                echo "run_invites=true" >> "$GITHUB_OUTPUT"
                echo "run_maintenance=false" >> "$GITHUB_OUTPUT"
                ;;
              maintenance)
                echo "run_invites=false" >> "$GITHUB_OUTPUT"
                echo "run_maintenance=true" >> "$GITHUB_OUTPUT"
                ;;
              both)
                echo "run_invites=true" >> "$GITHUB_OUTPUT"
                echo "run_maintenance=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported manual job selection: ${{ github.event.inputs.job }}"
                exit 1
                ;;
            esac
            echo "invite_limit=${{ github.event.inputs.invite_limit || '25' }}" >> "$GITHUB_OUTPUT"
            echo "retry_limit=${{ github.event.inputs.retry_limit || '50' }}" >> "$GITHUB_OUTPUT"
            echo "drift_limit=${{ github.event.inputs.drift_limit || '50' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight production scheduler target
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${SCHEDULER_BASE_URL:-}"
          if [ -z "$BASE_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=SCHEDULER_BASE_URL is not configured for the production environment." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          READYZ_STATUS="$(curl -sS -o /tmp/prod_readyz_body.txt -w '%{http_code}' "${BASE_URL%/}/health/readyz" || true)"
          if [ "$READYZ_STATUS" != "200" ]; then
            BODY="$(tr '\n' ' ' </tmp/prod_readyz_body.txt 2>/dev/null | cut -c1-200)"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=Backend readiness check failed for ${BASE_URL%/}/health/readyz (HTTP ${READYZ_STATUS:-000}${BODY:+: ${BODY}})." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          check_scheduler_path() {
            local path="$1"
            local label="$2"
            local status
            status="$(curl -sS -o /tmp/scheduler_probe_body.txt -w '%{http_code}' -X POST "${BASE_URL%/}${path}" || true)"
            case "$status" in
              200|202|401)
                return 0
                ;;
              *)
                local body=""
                body="$(tr '\n' ' ' </tmp/scheduler_probe_body.txt 2>/dev/null | cut -c1-200)"
                echo "available=false" >> "$GITHUB_OUTPUT"
                echo "reason=${label} is not available at ${BASE_URL%/}${path} (HTTP ${status:-000}${body:+: ${body}})." >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          }

          if [ "${{ steps.plan.outputs.run_invites }}" = "true" ]; then
            check_scheduler_path "/scheduler/calendar-invite-jobs" "Calendar invite scheduler route"
          fi

          if [ "${{ steps.plan.outputs.run_maintenance }}" = "true" ]; then
            check_scheduler_path "/scheduler/calendar-maintenance" "Calendar maintenance route"
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "reason=Scheduler target is healthy and required routes are present." >> "$GITHUB_OUTPUT"

      - name: Summarize production scheduler preflight
        shell: bash
        run: |
          echo "## Production scheduler preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base URL: \`${SCHEDULER_BASE_URL:-<unset>}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ steps.preflight.outputs.available == 'true' && 'run' || 'skip' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detail: ${{ steps.preflight.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger production calendar invite jobs
        if: ${{ steps.plan.outputs.run_invites == 'true' && steps.preflight.outputs.available == 'true' }}
        env:
          SCHEDULER_HMAC_SECRET: ${{ secrets.PRODUCTION_SCHEDULER_HMAC_SECRET }}
        run: |
          python3 scripts/deploy/trigger_scheduler.py \
            --path /scheduler/calendar-invite-jobs \
            --query "limit=${{ steps.plan.outputs.invite_limit }}"

      - name: Trigger production calendar maintenance
        if: ${{ steps.plan.outputs.run_maintenance == 'true' && steps.preflight.outputs.available == 'true' }}
        env:
          SCHEDULER_HMAC_SECRET: ${{ secrets.PRODUCTION_SCHEDULER_HMAC_SECRET }}
        run: |
          python3 scripts/deploy/trigger_scheduler.py \
            --path /scheduler/calendar-maintenance \
            --query "retry_limit=${{ steps.plan.outputs.retry_limit }}" \
            --query "drift_limit=${{ steps.plan.outputs.drift_limit }}"

  staging:
    name: Run staging calendar scheduler
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment_name == 'staging' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SCHEDULER_BASE_URL: ${{ vars.SCHEDULER_BASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve staging job plan
        id: plan
        shell: bash
        run: |
          case "${{ github.event.inputs.job }}" in
            invite)
              echo "run_invites=true" >> "$GITHUB_OUTPUT"
              echo "run_maintenance=false" >> "$GITHUB_OUTPUT"
              ;;
            maintenance)
              echo "run_invites=false" >> "$GITHUB_OUTPUT"
              echo "run_maintenance=true" >> "$GITHUB_OUTPUT"
              ;;
            both)
              echo "run_invites=true" >> "$GITHUB_OUTPUT"
              echo "run_maintenance=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported manual job selection: ${{ github.event.inputs.job }}"
              exit 1
              ;;
          esac
          echo "invite_limit=${{ github.event.inputs.invite_limit || '25' }}" >> "$GITHUB_OUTPUT"
          echo "retry_limit=${{ github.event.inputs.retry_limit || '50' }}" >> "$GITHUB_OUTPUT"
          echo "drift_limit=${{ github.event.inputs.drift_limit || '50' }}" >> "$GITHUB_OUTPUT"

      - name: Preflight staging scheduler target
        id: preflight
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${SCHEDULER_BASE_URL:-}"
          if [ -z "$BASE_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=SCHEDULER_BASE_URL is not configured for the staging environment." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          READYZ_STATUS="$(curl -sS -o /tmp/staging_readyz_body.txt -w '%{http_code}' "${BASE_URL%/}/health/readyz" || true)"
          if [ "$READYZ_STATUS" != "200" ]; then
            BODY="$(tr '\n' ' ' </tmp/staging_readyz_body.txt 2>/dev/null | cut -c1-200)"
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "reason=Backend readiness check failed for ${BASE_URL%/}/health/readyz (HTTP ${READYZ_STATUS:-000}${BODY:+: ${BODY}})." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          check_scheduler_path() {
            local path="$1"
            local label="$2"
            local status
            status="$(curl -sS -o /tmp/scheduler_probe_body.txt -w '%{http_code}' -X POST "${BASE_URL%/}${path}" || true)"
            case "$status" in
              200|202|401)
                return 0
                ;;
              *)
                local body=""
                body="$(tr '\n' ' ' </tmp/scheduler_probe_body.txt 2>/dev/null | cut -c1-200)"
                echo "available=false" >> "$GITHUB_OUTPUT"
                echo "reason=${label} is not available at ${BASE_URL%/}${path} (HTTP ${status:-000}${body:+: ${body}})." >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          }

          if [ "${{ steps.plan.outputs.run_invites }}" = "true" ]; then
            check_scheduler_path "/scheduler/calendar-invite-jobs" "Calendar invite scheduler route"
          fi

          if [ "${{ steps.plan.outputs.run_maintenance }}" = "true" ]; then
            check_scheduler_path "/scheduler/calendar-maintenance" "Calendar maintenance route"
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "reason=Scheduler target is healthy and required routes are present." >> "$GITHUB_OUTPUT"

      - name: Summarize staging scheduler preflight
        shell: bash
        run: |
          echo "## Staging scheduler preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base URL: \`${SCHEDULER_BASE_URL:-<unset>}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: \`${{ steps.preflight.outputs.available == 'true' && 'run' || 'skip' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detail: ${{ steps.preflight.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger staging calendar invite jobs
        if: ${{ steps.plan.outputs.run_invites == 'true' && steps.preflight.outputs.available == 'true' }}
        env:
          SCHEDULER_HMAC_SECRET: ${{ secrets.STAGING_SCHEDULER_HMAC_SECRET }}
        run: |
          python3 scripts/deploy/trigger_scheduler.py \
            --path /scheduler/calendar-invite-jobs \
            --query "limit=${{ steps.plan.outputs.invite_limit }}"

      - name: Trigger staging calendar maintenance
        if: ${{ steps.plan.outputs.run_maintenance == 'true' && steps.preflight.outputs.available == 'true' }}
        env:
          SCHEDULER_HMAC_SECRET: ${{ secrets.STAGING_SCHEDULER_HMAC_SECRET }}
        run: |
          python3 scripts/deploy/trigger_scheduler.py \
            --path /scheduler/calendar-maintenance \
            --query "retry_limit=${{ steps.plan.outputs.retry_limit }}" \
            --query "drift_limit=${{ steps.plan.outputs.drift_limit }}"
