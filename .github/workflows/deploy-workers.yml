name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'cloudflare-workers/**'
  workflow_dispatch:  # Allow manual deployment

concurrency:
  group: deploy-workers-production
  cancel-in-progress: false   # wrangler deploy + secret puts shouldn't be killed mid-run

permissions:
  contents: read

jobs:
  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    # Triggers above restrict to main + manual dispatch.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    env:
      WRANGLER_VERSION: 4.81.1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      ROOT_ADMIN_EMAIL: ${{ secrets.ROOT_ADMIN_EMAIL }}
      PLATFORM_METRICS_TOKEN: ${{ secrets.PLATFORM_METRICS_TOKEN }}
      BACKUP_SECRET: ${{ secrets.BACKUP_SECRET }}
      SCHEDULER_HMAC_SECRET: ${{ secrets.SCHEDULER_HMAC_SECRET }}
      UPTIME_KV_NAMESPACE_ID: ${{ vars.CLOUDFLARE_UPTIME_KV_NAMESPACE_ID || secrets.CLOUDFLARE_UPTIME_KV_NAMESPACE_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Validate Cloudflare deployment inputs
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            CLOUDFLARE_API_TOKEN
            NEXT_PUBLIC_API_BASE_URL
            CRON_SECRET
            RESEND_API_KEY
            ALERT_EMAIL
            ROOT_ADMIN_EMAIL
            PLATFORM_METRICS_TOKEN
            BACKUP_SECRET
            UPTIME_KV_NAMESPACE_ID
            SCHEDULER_HMAC_SECRET
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "Missing required Cloudflare deploy input: ${var_name}"
              exit 1
            fi
          done

      - name: Prepare uptime worker config
        shell: bash
        run: |
          set -euo pipefail
          # Render the substituted config next to the JS source — wrangler
          # resolves `main = "uptime-cron.js"` RELATIVE to the config file's
          # directory, so writing the rendered toml to ${RUNNER_TEMP} (as the
          # earlier version did) makes wrangler look for
          # ${RUNNER_TEMP}/uptime-cron.js, which doesn't exist, and the
          # deploy step bails with `entry-point file ... was not found`.
          # Keeping the rendered toml in cloudflare-workers/ keeps the
          # relative `main` path correct. The .rendered.toml suffix is
          # gitignored so it never accidentally gets committed.
          sed "s|<UPTIME_KV_NAMESPACE_ID>|${UPTIME_KV_NAMESPACE_ID}|g" \
            cloudflare-workers/uptime.wrangler.toml > cloudflare-workers/uptime.wrangler.rendered.toml

      - name: Validate uptime KV namespace exists in Cloudflare account
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "${UPTIME_KV_NAMESPACE_ID}" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "UPTIME_KV_NAMESPACE_ID must be a 32-character hex namespace id."
            exit 1
          fi

          namespaces_json="$(npx --yes "wrangler@${WRANGLER_VERSION}" kv namespace list --json)"
          if ! echo "${namespaces_json}" | jq -e --arg id "${UPTIME_KV_NAMESPACE_ID}" '.[] | select(.id == $id)' >/dev/null; then
            echo "UPTIME_KV_NAMESPACE_ID=${UPTIME_KV_NAMESPACE_ID} was not found in this Cloudflare account."
            exit 1
          fi

          if grep -q "<UPTIME_KV_NAMESPACE_ID>" cloudflare-workers/uptime.wrangler.rendered.toml; then
            echo "Uptime worker config template substitution failed."
            exit 1
          fi

      - name: Deploy Autopilot Cron Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config cloudflare-workers/autopilot.wrangler.toml
          printf '%s' "$NEXT_PUBLIC_API_BASE_URL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put NEXT_PUBLIC_API_BASE_URL --config cloudflare-workers/autopilot.wrangler.toml
          printf '%s' "$CRON_SECRET" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put CRON_SECRET --config cloudflare-workers/autopilot.wrangler.toml
          printf '%s' "$RESEND_API_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put RESEND_API_KEY --config cloudflare-workers/autopilot.wrangler.toml
          printf '%s' "$ALERT_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ALERT_EMAIL --config cloudflare-workers/autopilot.wrangler.toml
          printf '%s' "$ROOT_ADMIN_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ROOT_ADMIN_EMAIL --config cloudflare-workers/autopilot.wrangler.toml

      - name: Deploy Metrics Snapshot Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config cloudflare-workers/metrics-snapshot.wrangler.toml
          printf '%s' "$NEXT_PUBLIC_API_BASE_URL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put NEXT_PUBLIC_API_BASE_URL --config cloudflare-workers/metrics-snapshot.wrangler.toml
          printf '%s' "$PLATFORM_METRICS_TOKEN" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put PLATFORM_METRICS_TOKEN --config cloudflare-workers/metrics-snapshot.wrangler.toml
          printf '%s' "$RESEND_API_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put RESEND_API_KEY --config cloudflare-workers/metrics-snapshot.wrangler.toml
          printf '%s' "$ALERT_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ALERT_EMAIL --config cloudflare-workers/metrics-snapshot.wrangler.toml
          printf '%s' "$ROOT_ADMIN_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ROOT_ADMIN_EMAIL --config cloudflare-workers/metrics-snapshot.wrangler.toml

      - name: Deploy Backup Cron Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config cloudflare-workers/backup.wrangler.toml
          printf '%s' "$NEXT_PUBLIC_API_BASE_URL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put NEXT_PUBLIC_API_BASE_URL --config cloudflare-workers/backup.wrangler.toml
          printf '%s' "$BACKUP_SECRET" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put BACKUP_SECRET --config cloudflare-workers/backup.wrangler.toml
          printf '%s' "$RESEND_API_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put RESEND_API_KEY --config cloudflare-workers/backup.wrangler.toml
          printf '%s' "$ALERT_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ALERT_EMAIL --config cloudflare-workers/backup.wrangler.toml
          printf '%s' "$ROOT_ADMIN_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ROOT_ADMIN_EMAIL --config cloudflare-workers/backup.wrangler.toml

      - name: Deploy Uptime Cron Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config cloudflare-workers/uptime.wrangler.rendered.toml
          printf '%s' "$NEXT_PUBLIC_API_BASE_URL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put NEXT_PUBLIC_API_BASE_URL --config cloudflare-workers/uptime.wrangler.rendered.toml
          printf '%s' "$RESEND_API_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put RESEND_API_KEY --config cloudflare-workers/uptime.wrangler.rendered.toml
          printf '%s' "$ALERT_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ALERT_EMAIL --config cloudflare-workers/uptime.wrangler.rendered.toml
          printf '%s' "$ROOT_ADMIN_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ROOT_ADMIN_EMAIL --config cloudflare-workers/uptime.wrangler.rendered.toml

      - name: Deploy Trial Cron Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config cloudflare-workers/trial.wrangler.toml
          printf '%s' "$NEXT_PUBLIC_API_BASE_URL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put NEXT_PUBLIC_API_BASE_URL --config cloudflare-workers/trial.wrangler.toml
          printf '%s' "$CRON_SECRET" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put CRON_SECRET --config cloudflare-workers/trial.wrangler.toml
          printf '%s' "$RESEND_API_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put RESEND_API_KEY --config cloudflare-workers/trial.wrangler.toml
          printf '%s' "$ALERT_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ALERT_EMAIL --config cloudflare-workers/trial.wrangler.toml
          printf '%s' "$ROOT_ADMIN_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ROOT_ADMIN_EMAIL --config cloudflare-workers/trial.wrangler.toml

      - name: Deploy Scheduler Cron Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config cloudflare-workers/scheduler.wrangler.toml
          printf '%s' "$NEXT_PUBLIC_API_BASE_URL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put NEXT_PUBLIC_API_BASE_URL --config cloudflare-workers/scheduler.wrangler.toml
          printf '%s' "$SCHEDULER_HMAC_SECRET" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put SCHEDULER_HMAC_SECRET --config cloudflare-workers/scheduler.wrangler.toml
          printf '%s' "$CRON_SECRET" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put CRON_SECRET --config cloudflare-workers/scheduler.wrangler.toml
          printf '%s' "$RESEND_API_KEY" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put RESEND_API_KEY --config cloudflare-workers/scheduler.wrangler.toml
          printf '%s' "$ALERT_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ALERT_EMAIL --config cloudflare-workers/scheduler.wrangler.toml
          printf '%s' "$ROOT_ADMIN_EMAIL" | npx --yes "wrangler@${WRANGLER_VERSION}" secret put ROOT_ADMIN_EMAIL --config cloudflare-workers/scheduler.wrangler.toml

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ All Cloudflare Workers deployed successfully"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Cloudflare Workers deployment failed"
