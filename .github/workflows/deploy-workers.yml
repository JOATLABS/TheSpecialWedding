name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
      - 'development/**'
    paths:
      - 'cloudflare-workers/**'
  workflow_dispatch:  # Allow manual deployment

jobs:
  deploy-workers:
    name: Deploy Cloudflare Workers
    runs-on: ubuntu-latest
    # Run on main, development branches, or the current feature branch
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/development/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy Autopilot Cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare-workers
          wrangler deploy --config autopilot.wrangler.toml
          echo "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" | wrangler secret put NEXT_PUBLIC_API_BASE_URL --config autopilot.wrangler.toml
          echo "${{ secrets.CRON_SECRET }}" | wrangler secret put CRON_SECRET --config autopilot.wrangler.toml
          echo "${{ secrets.RESEND_API_KEY }}" | wrangler secret put RESEND_API_KEY --config autopilot.wrangler.toml
          echo "${{ secrets.ALERT_EMAIL }}" | wrangler secret put ALERT_EMAIL --config autopilot.wrangler.toml
          echo "${{ secrets.ROOT_ADMIN_EMAIL }}" | wrangler secret put ROOT_ADMIN_EMAIL --config autopilot.wrangler.toml

      - name: Deploy Metrics Snapshot Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare-workers
          wrangler deploy --config metrics-snapshot.wrangler.toml
          echo "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" | wrangler secret put NEXT_PUBLIC_API_BASE_URL --config metrics-snapshot.wrangler.toml
          echo "${{ secrets.ADMIN_TOKEN }}" | wrangler secret put ADMIN_TOKEN --config metrics-snapshot.wrangler.toml
          echo "${{ secrets.RESEND_API_KEY }}" | wrangler secret put RESEND_API_KEY --config metrics-snapshot.wrangler.toml
          echo "${{ secrets.ALERT_EMAIL }}" | wrangler secret put ALERT_EMAIL --config metrics-snapshot.wrangler.toml
          echo "${{ secrets.ROOT_ADMIN_EMAIL }}" | wrangler secret put ROOT_ADMIN_EMAIL --config metrics-snapshot.wrangler.toml

      - name: Deploy Backup Cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare-workers
          wrangler deploy --config backup.wrangler.toml
          echo "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" | wrangler secret put NEXT_PUBLIC_API_BASE_URL --config backup.wrangler.toml
          echo "${{ secrets.BACKUP_SECRET }}" | wrangler secret put BACKUP_SECRET --config backup.wrangler.toml
          echo "${{ secrets.RESEND_API_KEY }}" | wrangler secret put RESEND_API_KEY --config backup.wrangler.toml
          echo "${{ secrets.ALERT_EMAIL }}" | wrangler secret put ALERT_EMAIL --config backup.wrangler.toml
          echo "${{ secrets.ROOT_ADMIN_EMAIL }}" | wrangler secret put ROOT_ADMIN_EMAIL --config backup.wrangler.toml

      - name: Create KV Namespace for Uptime Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare-workers
          # Create KV namespace (ignore error if already exists)
          KV_OUTPUT=$(wrangler kv:namespace create "uptime-state" 2>&1) || true
          echo "KV creation output: $KV_OUTPUT"

          # Extract ID - try multiple patterns
          if echo "$KV_OUTPUT" | grep -q "already exists"; then
            echo "KV namespace already exists, fetching ID from list..."
            KV_ID=$(wrangler kv:namespace list --json | jq -r '.[] | select(.title | contains("uptime-state")) | .id' | head -1)
          else
            # Try to extract from creation output (format varies by wrangler version)
            KV_ID=$(echo "$KV_OUTPUT" | grep -oE '[a-f0-9]{32}' | head -1)
            if [ -z "$KV_ID" ]; then
              KV_ID=$(echo "$KV_OUTPUT" | grep -oP 'id = "\K[^"]+' || true)
            fi
          fi

          echo "Extracted KV namespace ID: $KV_ID"

          # Update wrangler.toml with the KV namespace ID (handle both placeholder formats)
          if [ -n "$KV_ID" ]; then
            sed -i "s|<YOUR_KV_NAMESPACE_ID>|$KV_ID|g" uptime.wrangler.toml
            sed -i "s|YOUR_KV_NAMESPACE_ID|$KV_ID|g" uptime.wrangler.toml
            echo "✓ KV namespace ID set: $KV_ID"
          else
            echo "⚠️ Warning: Could not extract KV namespace ID"
          fi

      - name: Deploy Uptime Cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare-workers
          wrangler deploy --config uptime.wrangler.toml
          echo "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" | wrangler secret put NEXT_PUBLIC_API_BASE_URL --config uptime.wrangler.toml
          echo "${{ secrets.RESEND_API_KEY }}" | wrangler secret put RESEND_API_KEY --config uptime.wrangler.toml
          echo "${{ secrets.ALERT_EMAIL }}" | wrangler secret put ALERT_EMAIL --config uptime.wrangler.toml
          echo "${{ secrets.ROOT_ADMIN_EMAIL }}" | wrangler secret put ROOT_ADMIN_EMAIL --config uptime.wrangler.toml

      - name: Deploy Trial Cron Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          cd cloudflare-workers
          wrangler deploy --config trial.wrangler.toml
          echo "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" | wrangler secret put NEXT_PUBLIC_API_BASE_URL --config trial.wrangler.toml
          echo "${{ secrets.CRON_SECRET }}" | wrangler secret put CRON_SECRET --config trial.wrangler.toml
          echo "${{ secrets.RESEND_API_KEY }}" | wrangler secret put RESEND_API_KEY --config trial.wrangler.toml
          echo "${{ secrets.ALERT_EMAIL }}" | wrangler secret put ALERT_EMAIL --config trial.wrangler.toml
          echo "${{ secrets.ROOT_ADMIN_EMAIL }}" | wrangler secret put ROOT_ADMIN_EMAIL --config trial.wrangler.toml

      - name: Notify on Success
        if: success()
        run: |
          echo "✅ All Cloudflare Workers deployed successfully"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Cloudflare Workers deployment failed"
