# =============================================================================
# Production promotion workflow
# Manually promotes an already-built image tag that has passed staging.
# =============================================================================
name: Promote Coolify Production

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Image tag to promote to production (immutable SHA tag)"
        required: true
      service:
        description: "Which service to deploy"
        required: false
        default: "both"
        type: choice
        options:
          - both
          - backend
          - frontend

permissions:
  contents: read
  packages: read

jobs:
  promote:
    uses: ./.github/workflows/coolify-deploy-shared.yml
    with:
      environment_name: production
      image_tag: ${{ github.event.inputs.image-tag }}
      service: ${{ github.event.inputs.service }}
      frontend_url: https://thespecialwedding.io
      api_url: https://api.thespecialwedding.io
      verify_couple: false
      verify_sse: false
    secrets:
      COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_BACKEND_UUID: ${{ secrets.COOLIFY_PRODUCTION_BACKEND_UUID }}
      COOLIFY_FRONTEND_UUID: ${{ secrets.COOLIFY_PRODUCTION_FRONTEND_UUID }}
      SMOKE_ADMIN_EMAIL: ${{ secrets.PRODUCTION_SMOKE_ADMIN_EMAIL }}
      SMOKE_ADMIN_PASSWORD: ${{ secrets.PRODUCTION_SMOKE_ADMIN_PASSWORD }}
      SMOKE_PUBLIC_WEDDING_SLUG: ${{ secrets.PRODUCTION_SMOKE_PUBLIC_WEDDING_SLUG }}
