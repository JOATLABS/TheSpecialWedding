name: Deploy Backend to Production

on:
  push:
    branches:
      - main
    paths:
      # Backend API files only (exclude frontend)
      - 'app/api/**'
      - 'app/core/**'
      - 'app/dependencies/**'
      - 'app/middleware/**'
      - 'app/models/**'
      - 'app/services/**'
      - 'app/tasks/**'
      - 'app/utils/**'
      - 'app/main.py'
      - 'scripts/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.prod.yml'
      - '.env.example'
  workflow_dispatch:  # Allow manual triggering

env:
  DEPLOYMENT_PATH: /var/www/wedding-app  # Adjust this to your actual path on droplet

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          # Run backend tests if they exist
          if [ -d "tests" ]; then
            python -m pytest tests/ -v || echo "Tests failed, but continuing deployment"
          else
            echo "No tests directory found, skipping tests"
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment scripts to droplet
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            scripts/deploy-production.sh scripts/build-env-from-secrets.sh \
            ${{ secrets.DROPLET_USERNAME }}@${{ secrets.DROPLET_HOST }}:${{ env.DEPLOYMENT_PATH }}/scripts/

      - name: Deploy to DigitalOcean Droplet
        env:
          # Pass all secrets as environment variables
          NODE_ENV: production
          API_ENV: production
          DEBUG: false
          PORT: ${{ secrets.PORT }}
          API_PORT: ${{ secrets.API_PORT }}
          PYTHONPATH: /app

          # Database
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}

          # Security
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM }}
          JWT_EXPIRE_MINUTES: ${{ secrets.JWT_EXPIRE_MINUTES }}
          API_KEY: ${{ secrets.API_KEY }}
          CSRF_SECRET_KEY: ${{ secrets.CSRF_SECRET_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}

          # Admin
          ROOT_ADMIN_EMAIL: ${{ secrets.ROOT_ADMIN_EMAIL }}
          PRIMARY_ADMIN_EMAIL: ${{ secrets.PRIMARY_ADMIN_EMAIL }}
          PRIMARY_ADMIN_PASSWORD: ${{ secrets.PRIMARY_ADMIN_PASSWORD }}

          # SMS
          SMS_PROVIDER: ${{ secrets.SMS_PROVIDER }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          TELNYX_PHONE_NUMBER: ${{ secrets.TELNYX_PHONE_NUMBER }}

          # Email
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

          # Storage
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_ACCESS_KEY_ID }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}

          # Stripe
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

          # Redis
          REDIS_HOST: redis
          REDIS_PORT: 6379

          # Feature flags
          ENABLE_CSRF_PROTECTION: ${{ secrets.ENABLE_CSRF_PROTECTION }}
          ENABLE_SECURITY_HEADERS: ${{ secrets.ENABLE_SECURITY_HEADERS }}
          ENABLE_RATE_LIMITING: ${{ secrets.ENABLE_RATE_LIMITING }}
          ENABLE_SAAS_FEATURES: ${{ secrets.ENABLE_SAAS_FEATURES }}
          ENABLE_SMS_REMINDERS: ${{ secrets.ENABLE_SMS_REMINDERS }}
          ENABLE_EMAIL_REMINDERS: ${{ secrets.ENABLE_EMAIL_REMINDERS }}
          ENABLE_AUDIT_LOGGING: ${{ secrets.ENABLE_AUDIT_LOGGING }}

          # Monitoring
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DROPLET_USERNAME }}@${{ secrets.DROPLET_HOST }} << 'ENDSSH'

            # Set deployment path
            DEPLOY_PATH="${{ env.DEPLOYMENT_PATH }}"

            # Navigate to project directory
            cd $DEPLOY_PATH || exit 1

            # Export all environment variables for the deployment script
            $(env | grep -E '^(NODE_ENV|API_ENV|DEBUG|PORT|API_PORT|PYTHONPATH|MONGO_|DATABASE_|SECRET_|JWT_|API_KEY|CSRF_|CORS_|ROOT_ADMIN|PRIMARY_ADMIN|SMS_|TWILIO_|TELNYX_|RESEND_|FROM_EMAIL|S3_|CLOUDFLARE_|STRIPE_|REDIS_|ENABLE_|LOG_LEVEL|SENTRY_)' | sed 's/^/export /')

            # Make scripts executable
            chmod +x scripts/deploy-production.sh scripts/build-env-from-secrets.sh

            # Build .env file from secrets
            bash scripts/build-env-from-secrets.sh

            # Run production deployment script
            bash scripts/deploy-production.sh
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key

      - name: Send deployment notification
        if: success()
        run: |
          echo "Deployment successful to production!"
          # Add Slack, Discord, or email notification here if needed

      - name: Send failure notification
        if: failure()
        run: |
          echo "Deployment failed! Check logs for details."
          # Add alert notification here if needed