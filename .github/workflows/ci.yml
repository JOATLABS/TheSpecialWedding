name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts
      - name: Run unit tests
        run: npm test

  firebase-integration:
    runs-on: ubuntu-latest
    needs: node-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install node dependencies
        run: npm ci --no-audit --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install python dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt --no-deps
          pip install 'requests>=2.32.4' firebase-admin google-cloud-firestore sentinels motor redis \
            pydantic-settings email-validator bleach stripe protobuf execnet coverage pytz
      - name: Run messaging service unit tests
        run: pytest tests/backend/test_messaging_service.py -q
        env:
          PYTHONPATH: ${{ github.workspace }}
          SECRET_KEY: test-secret
          MONGO_URI: mongodb://localhost:27017/test
      - name: Run Firestore repository integration tests
        run: |
          PYTHONPATH="${GITHUB_WORKSPACE}" FIRESTORE_PROJECT_ID=demo-wedding-app \
            node node_modules/firebase-tools/lib/bin/firebase.js emulators:exec \
            --project demo-wedding-app --only firestore \
            "pytest tests/backend/test_firestore_repository_emulator.py -q"
        env:
          SECRET_KEY: test-secret
          MONGO_URI: mongodb://localhost:27017/test
