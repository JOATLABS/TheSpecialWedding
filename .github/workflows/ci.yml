# =============================================================================
# CI Pipeline - Lint, Test, Security Audit, Integration Tests, Build & Push
# Runs on every push to main and every PR targeting main.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/lopewale/wedding-app-backend
  FRONTEND_IMAGE: ghcr.io/lopewale/wedding-app-frontend
  FRONTEND_BUILD_URL: https://build.thespecialwedding.invalid

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  # ── Detect changed paths (PR only) ─────────────────────────────────────────
  # Lint jobs always run — they're cheap and catch cross-stack breakage.
  # The expensive jobs (integration-test, docker-build-test) gate on these
  # outputs. On push-to-main we ignore these outputs and run everything.
  #
  # `app/` is mixed frontend+backend, so we filter by file extension, not
  # subdirectory. Keep this list in sync with reviewers' intuition — if a
  # frontend-only refactor mysteriously triggers integration-test, extend
  # the `frontend` filter instead of the `backend` filter.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'app/**/*.py'
              - 'tests/**'
              - 'requirements*.txt'
              - 'Dockerfile.backend'
              - 'docker-compose.test.yml'
              - 'scripts/**/*.py'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'app/**/*.tsx'
              - 'app/**/*.ts'
              - 'app/**/*.jsx'
              - 'app/**/*.js'
              - 'app/**/*.css'
              - 'public/**'
              - 'package.json'
              - 'package-lock.json'
              - 'next.config.*'
              - 'tsconfig.json'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'Dockerfile.frontend'
              - 'middleware.ts'
              - '.github/workflows/ci.yml'

  # ── Repository hygiene ────────────────────────────────────────────────────
  repo-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for Finder copy artifacts
        run: npm run repo:check-copy-artifacts

  # ── Frontend: Lint + Type Check ────────────────────────────────────────────
  frontend-lint:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type check
        run: npm run type-check

      - name: Frontend build
        run: npm run build
        env:
          FRONTEND_URL: ${{ env.FRONTEND_BUILD_URL }}

  # ── Frontend: Tests ────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Backend: Lint + Unit Test ──────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff -r requirements-test.txt

      - name: Ruff lint
        run: ruff check app/

      - name: Ruff format check
        run: ruff format --check app/

      - name: Run backend boot smoke test
        run: pytest tests/backend/test_app_boot_smoke.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Run unit tests
        run: pytest tests/backend/ tests/test_id_utils.py -v --tb=short
        env:
          PYTHONPATH: .

  # ── Integration Tests: Full Stack ──────────────────────────────────────────
  # Spins up backend + MongoDB + Redis via docker-compose, runs 100+ tests
  # against the real running API. This catches bugs that unit tests miss.
  integration-test:
    name: Integration Tests (Full Stack)
    runs-on: ubuntu-latest
    needs: [backend-lint, changes]
    # On PR, only run when backend-relevant files changed. On push-to-main /
    # manual dispatch we always run — `build-backend` + `smoke-test` depend on
    # a green integration pass, and we never want to ship a backend image that
    # hasn't been exercised end-to-end. `always()` is required because
    # `changes` is skipped on non-PR events (has its own `if:` gate).
    if: |
      always() && needs.backend-lint.result == 'success' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Set up buildx before compose so `docker compose build` (invoked by
      # `--build`) uses the buildx driver and picks up ACTIONS_CACHE_URL +
      # ACTIONS_RUNTIME_TOKEN for the `type=gha` cache declared on backend-test
      # in docker-compose.test.yml.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and start test stack
        run: |
          docker compose -f docker-compose.test.yml up -d --build --wait
        timeout-minutes: 8

      - name: Wait for backend health
        run: |
          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8000/health/livez 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend is healthy after attempt $i"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend failed to start after 30 attempts"
              docker compose -f docker-compose.test.yml logs backend-test
              exit 1
            fi
            echo "Attempt $i: HTTP $STATUS, waiting..."
            sleep 3
          done

      - name: Verify readiness (DB + Redis connected)
        run: |
          RESP=$(curl -s http://localhost:8000/health/readyz)
          echo "Readiness check: $RESP"
          STATUS=$(echo "$RESP" | python3 -c "import sys, json; print(json.load(sys.stdin)['status'])" 2>/dev/null || echo "unknown")
          if [ "$STATUS" != "ready" ]; then
            echo "Backend is not ready (DB or Redis not connected)"
            docker compose -f docker-compose.test.yml logs
            exit 1
          fi
          echo "Full stack is ready: MongoDB + Redis connected"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Verify tracked integration test suite exists
        run: |
          if [ ! -d tests/integration ]; then
            echo "tests/integration/ is missing from the checked-out commit."
            echo "This suite must stay tracked because CI executes it directly."
            exit 1
          fi

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt "pyjwt[crypto]>=2.8.0"

      - name: Run integration tests
        run: |
          set -o pipefail
          mkdir -p test-results
          pytest tests/integration/ -v --tb=short -x \
            --junitxml=test-results/integration.xml \
            2>&1 | tee test-results/integration.log
        env:
          TEST_API_URL: http://localhost:8000
          TEST_ADMIN_EMAIL: testadmin@thespecialwedding.io
          TEST_ADMIN_PASSWORD: TestAdmin123!SecurePassword
          PYTHONPATH: .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose -f docker-compose.test.yml logs backend-test --tail=100
          echo ""
          echo "=== MongoDB Logs ==="
          docker compose -f docker-compose.test.yml logs mongo-test --tail=50

      - name: Tear down test stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ── Build & Push Backend Image ─────────────────────────────────────────────
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: [backend-lint, integration-test]
    # Build publishable images from main pushes and manual bootstrap runs.
    #
    # `always()` is required to defend against transitive cascade-skip from
    # `changes` → `integration-test` → here. Even though `integration-test`
    # uses `if: always()` to run despite `changes` being skipped on push,
    # GitHub propagates `changes`'s skipped status downstream unless every
    # subsequent job explicitly opts out via `always()` + an explicit
    # `result == 'success'` gate. Without this, on push-to-main this job
    # silently skips, no image lands in GHCR at the merge SHA, and the
    # auto-deploy workflow_run fails with `manifest unknown`.
    # See: github.com/LopeWale/WeddingWebApp/actions/runs/24976033706
    if: |
      always() &&
      needs.backend-lint.result == 'success' &&
      needs.integration-test.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ── Build & Push Frontend Image ────────────────────────────────────────────
  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-test, integration-test]
    # See `build-backend` for why `always()` is required — same cascade-skip
    # defense, applied here because this job also transitively depends on
    # the path-filtered `changes` job through `integration-test`.
    if: |
      always() &&
      needs.frontend-lint.result == 'success' &&
      needs.frontend-test.result == 'success' &&
      needs.integration-test.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            FRONTEND_URL=${{ env.FRONTEND_BUILD_URL }}

  # ── Smoke Test: Validate built images start correctly ──────────────────────
  smoke-test:
    name: Smoke Test Built Images
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    # See `build-backend` for why `always()` is required.
    if: |
      always() &&
      needs.build-backend.result == 'success' &&
      needs.build-frontend.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get image tag
        id: tag
        run: |
          SHA="${{ github.sha }}"
          echo "tag=${SHA::7}" >> $GITHUB_OUTPUT

      - name: Start full stack with built images
        run: |
          # Start MongoDB and Redis
          docker run -d --name mongo-smoke \
            --tmpfs /data/db \
            -p 27017:27017 \
            mongo:7.0

          docker run -d --name redis-smoke \
            -p 6379:6379 \
            redis:7-alpine redis-server --save "" --appendonly no

          # Wait for deps
          sleep 5

          # Start backend with the GHCR image we just pushed
          docker run -d --name backend-smoke \
            --network host \
            -e MONGODB_URL=mongodb://localhost:27017/smoke_test \
            -e MONGO_URI=mongodb://localhost:27017 \
            -e MONGO_DB=smoke_test \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e "SECRET_KEY=smoke-test-secret-key-long-enough-for-validation-purposes-here" \
            -e API_KEY=smoke-test-api-key \
            -e ENVIRONMENT=testing \
            -e ROOT_ADMIN_EMAIL=smoke@test.com \
            -e ROOT_ADMIN_PASSWORD=SmokeTest123!Password \
            -e ENABLE_RATE_LIMITING=false \
            -e ENABLE_CSRF_PROTECTION=false \
            -e "CORS_ORIGINS=http://localhost:3000" \
            -e "ALLOWED_HOSTS=localhost,127.0.0.1" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e NEXT_PUBLIC_API_BASE_URL=http://localhost:8000 \
            -e S3_REGION=auto \
            -e S3_BUCKET_NAME=${{ vars.S3_BUCKET_NAME }} \
            -e S3_AD_BUCKET_NAME=${{ vars.S3_AD_BUCKET_NAME }} \
            -e MOCK_SMS_PROVIDER=true \
            -e MOCK_EMAIL_PROVIDER=true \
            ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.tag }} \
            sh -c "python scripts/setup_admin_user.py --auto-create && uvicorn app.main:app --host 0.0.0.0 --port 8000"

          # Start frontend
          docker run -d --name frontend-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e FRONTEND_URL=http://localhost:3000 \
            -e INTERNAL_API_BASE_URL=http://host.docker.internal:8000 \
            ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.tag }}

      - name: Wait and verify backend
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8000/health/livez 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Backend alive (attempt $i)"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Backend failed to start"
              docker logs backend-smoke --tail=50
              exit 1
            fi
            sleep 3
          done

          # Verify DB connectivity
          READYZ=$(curl -s http://localhost:8000/health/readyz)
          echo "Readiness: $READYZ"

          # Test auth flow
          LOGIN=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            http://localhost:8000/admin/token \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke@test.com","password":"SmokeTest123!Password"}')
          echo "Login test: HTTP $LOGIN"
          if [ "$LOGIN" != "200" ]; then
            echo "Auth flow broken!"
            docker logs backend-smoke --tail=30
            exit 1
          fi

          echo "Backend smoke test passed: health + auth working"

      - name: Wait and verify frontend
        run: |
          echo "Waiting for frontend..."
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:3000/ 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Frontend alive (attempt $i)"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "Frontend failed to start"
              docker logs frontend-smoke --tail=50
              exit 1
            fi
            sleep 3
          done
          PROXY_STATUS=$(curl -s -o /tmp/proxy-health.json -w "%{http_code}" --max-time 5 http://localhost:3000/api/proxy/health/livez 2>/dev/null || echo "000")
          echo "Frontend proxy health: HTTP $PROXY_STATUS"
          if [ "$PROXY_STATUS" != "200" ]; then
            echo "Frontend /api/proxy failed to reach backend"
            cat /tmp/proxy-health.json 2>/dev/null || true
            docker logs frontend-smoke --tail=50
            docker logs backend-smoke --tail=50
            exit 1
          fi
          echo "Frontend smoke test passed"

      - name: All smoke tests passed
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: healthy, auth working" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: healthy, serving pages and proxying /api/proxy" >> $GITHUB_STEP_SUMMARY
          echo "- Image tag: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: |
          docker stop backend-smoke frontend-smoke mongo-smoke redis-smoke 2>/dev/null || true
          docker rm backend-smoke frontend-smoke mongo-smoke redis-smoke 2>/dev/null || true

  # ── PR-only: Frontend Docker build test (no push) ─────────────────────────
  # Backend Docker build is already exercised end-to-end by `integration-test`
  # (docker-compose.test.yml builds from Dockerfile.backend). Only the frontend
  # Dockerfile has no PR-path coverage, so this job is frontend-only.
  # The job name is kept as "Docker Build Test" to preserve existing branch
  # protection required-status-check configuration.
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [frontend-lint, changes]
    # PR-only job gated on frontend path changes. `always()` is required so
    # we can reference `changes.outputs` even when its status is skipped.
    if: |
      always() && needs.frontend-lint.result == 'success' &&
      github.event_name == 'pull_request' && needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build frontend (test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          cache-from: type=gha,scope=frontend
          build-args: |
            FRONTEND_URL=${{ env.FRONTEND_BUILD_URL }}

  # ── CI Passed: Branch-protection aggregator ────────────────────────────────
  # Single required status check for branch protection rulesets. This is the
  # *only* check name that should be listed under "Status checks that are
  # required" — everything else is either always-on (lint), path-filtered
  # (integration-test, docker-build-test), or push-only (build-*, smoke-test),
  # and listing them directly would make protection settings drift whenever
  # the workflow evolves.
  #
  # Semantics, in two layers:
  #
  # 1. PR + always-on: every upstream job in `needs` must resolve to
  #    `success` or `skipped` (path-filtered jobs legitimately skip).
  #    `failure` / `cancelled` / `timed_out` always fail the gate.
  #
  # 2. push-to-main only: the build/smoke jobs that produce the deployable
  #    artifact (`build-backend`, `build-frontend`, `smoke-test`) must
  #    resolve to `success` specifically — `skipped` is NOT acceptable on
  #    main pushes because the auto-deploy workflow_run downstream expects
  #    a fresh GHCR image at this commit's SHA. A silent build skip used to
  #    pass `ci-passed` and then fail at deploy with `manifest unknown`
  #    (run 24976033706). The `MUST_RUN_JOBS` check below closes that hole.
  #
  # Cascade-skip safety: if, e.g., `backend-lint` fails, `integration-test`
  # cascade-skips (its `if:` gates on backend-lint.result == 'success'), but
  # `backend-lint` itself is in `needs:` here — its `failure` result surfaces
  # directly, so the cascade-skipped child passing through as `skipped` is
  # fine.
  #
  # When adding a new job that should gate merges, append it to `needs:`.
  # When adding a new job that produces a deployable artifact on main,
  # append its key to `MUST_RUN_JOBS` below as well.
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - changes
      - frontend-lint
      - frontend-test
      - backend-lint
      - integration-test
      - build-backend
      - build-frontend
      - smoke-test
      - docker-build-test
    if: always()
    steps:
      - name: Verify no upstream job failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN_PUSH: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          set -euo pipefail
          echo "Upstream job results:"
          echo "$NEEDS_JSON" | jq .

          # Layer 1: any failure / cancelled / timed_out is fatal everywhere.
          FAILED=$(echo "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result != "success" and .value.result != "skipped") | .key)
            | join(", ")
          ')
          if [ -n "$FAILED" ]; then
            echo "::error::Upstream job(s) failed or were cancelled: $FAILED"
            exit 1
          fi

          # Layer 2: on push-to-main, the build/smoke jobs must resolve to
          # `success` specifically — `skipped` is unsafe because the
          # auto-deploy workflow_run downstream needs a fresh GHCR image at
          # this commit's SHA.
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            MUST_RUN_JOBS="build-backend build-frontend smoke-test"
            MISSING=""
            for job in $MUST_RUN_JOBS; do
              RESULT=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result // "missing"')
              if [ "$RESULT" != "success" ]; then
                MISSING="${MISSING:+$MISSING, }$job ($RESULT)"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "::error::On push-to-main these jobs must run and succeed (got: $MISSING). Likely cascade-skip from a path-filtered upstream — see the build-backend if-clause comment in this file."
              exit 1
            fi
            echo "Push-to-main build chain is intact: $MUST_RUN_JOBS all succeeded."
          fi

          echo "All upstream jobs passed or were legitimately skipped."
