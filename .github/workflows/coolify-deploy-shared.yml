# =============================================================================
# Shared Coolify deployment workflow
# Used by staging auto-deploy and production manual promotion.
# =============================================================================
name: Coolify Deploy Shared

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      service:
        required: false
        default: both
        type: string
      frontend_url:
        required: true
        type: string
      api_url:
        required: true
        type: string
      verify_couple:
        required: false
        default: false
        type: boolean
      verify_sse:
        required: false
        default: true
        type: boolean
      allow_insecure_tls:
        required: false
        default: false
        type: boolean
    secrets:
      COOLIFY_BASE_URL:
        required: true
      COOLIFY_API_TOKEN:
        required: true
      COOLIFY_BACKEND_UUID:
        required: true
      COOLIFY_FRONTEND_UUID:
        required: true
      SMOKE_ADMIN_EMAIL:
        required: true
      SMOKE_ADMIN_PASSWORD:
        required: true
      SMOKE_COUPLE_EMAIL:
        required: false
      SMOKE_COUPLE_PASSWORD:
        required: false
      SMOKE_PUBLIC_WEDDING_SLUG:
        required: false

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  BACKEND_IMAGE: ghcr.io/lopewale/wedding-app-backend
  FRONTEND_IMAGE: ghcr.io/lopewale/wedding-app-frontend

jobs:
  prepare:
    name: Prepare ${{ inputs.environment_name }} deploy
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      deploy-backend: ${{ steps.target.outputs.backend }}
      deploy-frontend: ${{ steps.target.outputs.frontend }}
    steps:
      - name: Normalize image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "image_tag input is required"
            exit 1
          fi
          if [ "${#TAG}" -gt 12 ]; then
            TAG="${TAG:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Determine deploy targets
        id: target
        run: |
          SERVICE="${{ inputs.service }}"
          case "$SERVICE" in
            both)
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
              ;;
            backend)
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported service target: $SERVICE"
              exit 1
              ;;
          esac

      - name: Summary
        run: |
          echo "## Coolify Deploy Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: ${{ inputs.environment_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag**: \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend**: ${{ steps.target.outputs.backend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend**: ${{ steps.target.outputs.frontend }}" >> "$GITHUB_STEP_SUMMARY"

  validate-images:
    name: Validate target images (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify requested image tags exist in GHCR
        env:
          TAG: ${{ needs.prepare.outputs.image-tag }}
          DEPLOY_BACKEND: ${{ needs.prepare.outputs.deploy-backend }}
          DEPLOY_FRONTEND: ${{ needs.prepare.outputs.deploy-frontend }}
        run: |
          set -euo pipefail

          if [ "$DEPLOY_BACKEND" = "true" ]; then
            docker manifest inspect "${{ env.BACKEND_IMAGE }}:${TAG}" >/dev/null
            echo "Validated backend target image: ${{ env.BACKEND_IMAGE }}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            docker manifest inspect "${{ env.FRONTEND_IMAGE }}:${TAG}" >/dev/null
            echo "Validated frontend target image: ${{ env.FRONTEND_IMAGE }}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-backend:
    name: Deploy backend (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    needs: [prepare, validate-images]
    if: needs.prepare.outputs.deploy-backend == 'true'
    outputs:
      previous-name: ${{ steps.rollback-target.outputs.name }}
      previous-tag: ${{ steps.rollback-target.outputs.tag }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.api_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Read current backend image reference
        id: current-image
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py image-ref \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR for rollback validation
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate current backend rollback target
        id: rollback-target
        env:
          NAME: ${{ steps.current-image.outputs.name }}
          TAG: ${{ steps.current-image.outputs.tag }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${NAME}:${TAG}" >/dev/null 2>&1; then
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Backend rollback target is valid: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Backend rollback target ${NAME}:${TAG} does not exist in GHCR. Automatic rollback for the backend will be skipped rather than restoring a broken image reference."
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Backend rollback target is invalid and will be skipped: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update backend image reference
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.image-tag }}"
          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --image-name "${{ env.BACKEND_IMAGE }}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Restart backend
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    needs: [prepare, validate-images]
    if: needs.prepare.outputs.deploy-frontend == 'true'
    outputs:
      previous-name: ${{ steps.rollback-target.outputs.name }}
      previous-tag: ${{ steps.rollback-target.outputs.tag }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.frontend_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Read current frontend image reference
        id: current-image
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py image-ref \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR for rollback validation
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate current frontend rollback target
        id: rollback-target
        env:
          NAME: ${{ steps.current-image.outputs.name }}
          TAG: ${{ steps.current-image.outputs.tag }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${NAME}:${TAG}" >/dev/null 2>&1; then
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Frontend rollback target is valid: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Frontend rollback target ${NAME}:${TAG} does not exist in GHCR. Automatic rollback for the frontend will be skipped rather than restoring a broken image reference."
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Frontend rollback target is invalid and will be skipped: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update frontend image reference
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          TAG="${{ needs.prepare.outputs.image-tag }}"
          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --image-name "${{ env.FRONTEND_IMAGE }}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Restart frontend
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    needs: [prepare, deploy-backend, deploy-frontend]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.deploy-backend.result != 'failure' &&
        needs.deploy-backend.result != 'cancelled' &&
        needs.deploy-frontend.result != 'failure' &&
        needs.deploy-frontend.result != 'cancelled'
      }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.frontend_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run smoke verification
        env:
          FRONTEND_URL: ${{ inputs.frontend_url }}
          API_URL: ${{ inputs.api_url }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_COUPLE_EMAIL: ${{ secrets.SMOKE_COUPLE_EMAIL }}
          SMOKE_COUPLE_PASSWORD: ${{ secrets.SMOKE_COUPLE_PASSWORD }}
          SMOKE_PUBLIC_WEDDING_SLUG: ${{ secrets.SMOKE_PUBLIC_WEDDING_SLUG }}
        run: |
          set -euo pipefail
          ARGS=(
            --frontend-base "$FRONTEND_URL"
            --api-base "$API_URL"
            --admin-email "$SMOKE_ADMIN_EMAIL"
            --admin-password "$SMOKE_ADMIN_PASSWORD"
          )

          if [ -n "${SMOKE_PUBLIC_WEDDING_SLUG:-}" ]; then
            ARGS+=(--public-slug "$SMOKE_PUBLIC_WEDDING_SLUG")
          fi

          if [ "${{ inputs.verify_sse }}" != "true" ]; then
            ARGS+=(--skip-sse)
          fi

          if [ "${{ inputs.allow_insecure_tls }}" = "true" ]; then
            ARGS+=(--allow-insecure-tls)
          fi

          if [ "${{ inputs.verify_couple }}" = "true" ]; then
            if [ -z "${SMOKE_COUPLE_EMAIL:-}" ] || [ -z "${SMOKE_COUPLE_PASSWORD:-}" ]; then
              echo "Couple verification was requested but the staging couple smoke credentials are missing."
              exit 1
            fi
            ARGS+=(--couple-email "$SMOKE_COUPLE_EMAIL" --couple-password "$SMOKE_COUPLE_PASSWORD")
          fi

          python scripts/deploy/verify_environment.py "${ARGS[@]}"

  rollback:
    name: Roll back ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    needs: [prepare, deploy-backend, deploy-frontend, verify]
    if: failure()
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ inputs.frontend_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Roll back backend
        if: >-
          ${{
            needs.prepare.outputs.deploy-backend == 'true' &&
            needs.deploy-backend.outputs.previous-name != '' &&
            needs.deploy-backend.outputs.previous-tag != '' &&
            (needs.deploy-backend.result == 'failure' || needs.verify.result == 'failure')
          }}
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          NAME="${{ needs.deploy-backend.outputs.previous-name }}"
          TAG="${{ needs.deploy-backend.outputs.previous-tag }}"
          if [ -z "$NAME" ]; then
            echo "Missing recorded backend rollback image name."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "Missing recorded backend rollback tag."
            exit 1
          fi

          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --image-name "${NAME}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Roll back frontend
        if: >-
          ${{
            needs.prepare.outputs.deploy-frontend == 'true' &&
            needs.deploy-frontend.outputs.previous-name != '' &&
            needs.deploy-frontend.outputs.previous-tag != '' &&
            (needs.deploy-frontend.result == 'failure' || needs.verify.result == 'failure')
          }}
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          NAME="${{ needs.deploy-frontend.outputs.previous-name }}"
          TAG="${{ needs.deploy-frontend.outputs.previous-tag }}"
          if [ -z "$NAME" ]; then
            echo "Missing recorded frontend rollback image name."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "Missing recorded frontend rollback tag."
            exit 1
          fi

          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --image-name "${NAME}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
