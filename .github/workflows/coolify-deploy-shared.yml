# =============================================================================
# Shared Coolify deployment workflow
# Used by staging auto-deploy and production manual promotion.
# =============================================================================
name: Coolify Deploy Shared

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      service:
        required: false
        default: both
        type: string
      verify_couple:
        required: false
        default: false
        type: boolean
      verify_sse:
        required: false
        default: true
        type: boolean
      allow_insecure_tls:
        required: false
        default: false
        type: boolean
      # When true, validate-images falls back to the `:latest` tag if the
      # requested SHA tag is missing in GHCR. Used by the auto-deploy
      # path (workflow_run after CI-on-main) where a missing SHA usually
      # means a CI build job silently cascade-skipped — we'd rather ship
      # the most recent good image to staging than block. Manual
      # production promotion (promote-coolify-production.yml) keeps this
      # OFF so explicit SHA promotions never silently use `latest`.
      allow_image_fallback:
        required: false
        default: false
        type: boolean
    secrets:
      COOLIFY_BASE_URL:
        required: true
      COOLIFY_API_TOKEN:
        required: true
      COOLIFY_BACKEND_UUID:
        required: true
      COOLIFY_FRONTEND_UUID:
        required: true
      SMOKE_ADMIN_EMAIL:
        required: true
      SMOKE_ADMIN_PASSWORD:
        required: true
      SMOKE_COUPLE_EMAIL:
        required: false
      SMOKE_COUPLE_PASSWORD:
        required: false
      SMOKE_PUBLIC_WEDDING_SLUG:
        required: false

concurrency:
  group: deploy-${{ inputs.environment_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  BACKEND_IMAGE: ghcr.io/lopewale/wedding-app-backend
  FRONTEND_IMAGE: ghcr.io/lopewale/wedding-app-frontend

jobs:
  prepare:
    name: Prepare ${{ inputs.environment_name }} deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment_name }}
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      deploy-backend: ${{ steps.target.outputs.backend }}
      deploy-frontend: ${{ steps.target.outputs.frontend }}
      frontend-url: ${{ steps.urls.outputs.frontend_url }}
      api-url: ${{ steps.urls.outputs.api_url }}
    steps:
      - name: Normalize image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            echo "image_tag input is required"
            exit 1
          fi
          if [ "${#TAG}" -gt 12 ]; then
            TAG="${TAG:0:7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Determine deploy targets
        id: target
        run: |
          SERVICE="${{ inputs.service }}"
          case "$SERVICE" in
            both)
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
              ;;
            backend)
              echo "backend=true" >> "$GITHUB_OUTPUT"
              echo "frontend=false" >> "$GITHUB_OUTPUT"
              ;;
            frontend)
              echo "backend=false" >> "$GITHUB_OUTPUT"
              echo "frontend=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported service target: $SERVICE"
              exit 1
              ;;
          esac

      - name: Resolve environment URLs
        id: urls
        env:
          FRONTEND_URL_VALUE: ${{ vars.FRONTEND_URL }}
          API_URL_VALUE: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${FRONTEND_URL_VALUE:-}" ]; then
            echo "Missing required environment variable FRONTEND_URL for ${{ inputs.environment_name }}."
            exit 1
          fi

          if [ -z "${API_URL_VALUE:-}" ]; then
            echo "Missing required environment variable NEXT_PUBLIC_API_BASE_URL for ${{ inputs.environment_name }}."
            exit 1
          fi

          echo "frontend_url=${FRONTEND_URL_VALUE}" >> "$GITHUB_OUTPUT"
          echo "api_url=${API_URL_VALUE}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Coolify Deploy Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: ${{ inputs.environment_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image tag**: \`${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend**: ${{ steps.target.outputs.backend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend**: ${{ steps.target.outputs.frontend }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend URL**: \`${{ steps.urls.outputs.frontend_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API URL**: \`${{ steps.urls.outputs.api_url }}\`" >> "$GITHUB_STEP_SUMMARY"

  validate-images:
    name: Validate target images (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      # The tag actually used for deploy. Equals the requested SHA when the
      # manifest exists; falls back to `latest` if the requested SHA is
      # missing AND `allow_image_fallback` is true. Otherwise the job fails.
      effective-tag: ${{ steps.verify.outputs.effective_tag }}
      fallback-used: ${{ steps.verify.outputs.fallback_used }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify requested image tags exist in GHCR
        id: verify
        env:
          TAG: ${{ needs.prepare.outputs.image-tag }}
          DEPLOY_BACKEND: ${{ needs.prepare.outputs.deploy-backend }}
          DEPLOY_FRONTEND: ${{ needs.prepare.outputs.deploy-frontend }}
          ALLOW_FALLBACK: ${{ inputs.allow_image_fallback }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          set -euo pipefail

          # Validate one image and emit the tag actually usable. If the
          # requested SHA tag is missing and fallback is allowed, try
          # `latest`. If both are missing, fail loudly (a manual
          # promotion shouldn't silently invent a target).
          resolve_tag () {
            local kind="$1"     # backend | frontend
            local image="$2"    # registry path

            if docker manifest inspect "${image}:${TAG}" >/dev/null 2>&1; then
              echo "Validated ${kind} target image: ${image}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
              echo "$TAG"
              return 0
            fi

            if [ "$ALLOW_FALLBACK" != "true" ]; then
              echo "::error::${kind} image ${image}:${TAG} not found in GHCR and allow_image_fallback=false. CI build likely cascade-skipped — re-run CI or pass an explicit existing tag."
              return 1
            fi

            if docker manifest inspect "${image}:latest" >/dev/null 2>&1; then
              echo "::warning::${kind} image ${image}:${TAG} not found; falling back to ${image}:latest because allow_image_fallback=true. This usually means CI's build job cascade-skipped — investigate before the next deploy."
              echo "Fell back to ${kind} ${image}:latest (requested ${TAG} missing)" >> "$GITHUB_STEP_SUMMARY"
              echo "latest"
              return 0
            fi

            echo "::error::${kind} image not found at either ${image}:${TAG} or ${image}:latest — nothing to deploy."
            return 1
          }

          BACKEND_TAG=""
          FRONTEND_TAG=""
          FALLBACK_USED="false"

          if [ "$DEPLOY_BACKEND" = "true" ]; then
            BACKEND_TAG="$(resolve_tag backend "$BACKEND_IMAGE")"
            if [ "$BACKEND_TAG" != "$TAG" ]; then FALLBACK_USED="true"; fi
          fi

          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            FRONTEND_TAG="$(resolve_tag frontend "$FRONTEND_IMAGE")"
            if [ "$FRONTEND_TAG" != "$TAG" ]; then FALLBACK_USED="true"; fi
          fi

          # Single deploy uses one tag for both services. If both are being
          # deployed, they MUST resolve to the same tag — otherwise the
          # frontend and backend would ship from different commits.
          if [ "$DEPLOY_BACKEND" = "true" ] && [ "$DEPLOY_FRONTEND" = "true" ] && [ "$BACKEND_TAG" != "$FRONTEND_TAG" ]; then
            echo "::error::Backend resolved to ${BACKEND_TAG} but frontend resolved to ${FRONTEND_TAG}. Refusing to deploy mismatched tags."
            exit 1
          fi

          EFFECTIVE_TAG="${BACKEND_TAG:-$FRONTEND_TAG}"
          echo "effective_tag=${EFFECTIVE_TAG}" >> "$GITHUB_OUTPUT"
          echo "fallback_used=${FALLBACK_USED}" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Deploy backend (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    needs: [prepare, validate-images]
    if: needs.prepare.outputs.deploy-backend == 'true'
    outputs:
      previous-name: ${{ steps.rollback-target.outputs.name }}
      previous-tag: ${{ steps.rollback-target.outputs.tag }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ needs.prepare.outputs.api-url }}
    steps:
      - uses: actions/checkout@v6

      - name: Read current backend image reference
        id: current-image
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py image-ref \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR for rollback validation
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate current backend rollback target
        id: rollback-target
        env:
          NAME: ${{ steps.current-image.outputs.name }}
          TAG: ${{ steps.current-image.outputs.tag }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${NAME}:${TAG}" >/dev/null 2>&1; then
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Backend rollback target is valid: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Backend rollback target ${NAME}:${TAG} does not exist in GHCR. Automatic rollback for the backend will be skipped rather than restoring a broken image reference."
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Backend rollback target is invalid and will be skipped: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update backend image reference
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # Use the tag validate-images actually verified — falls back to
          # `latest` when allowed and the requested SHA is missing. See
          # the validate-images job for the resolution rules.
          TAG="${{ needs.validate-images.outputs.effective-tag }}"
          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --image-name "${{ env.BACKEND_IMAGE }}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Restart backend
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: Deploy frontend (${{ inputs.environment_name }})
    runs-on: ubuntu-latest
    needs: [prepare, validate-images]
    if: needs.prepare.outputs.deploy-frontend == 'true'
    outputs:
      previous-name: ${{ steps.rollback-target.outputs.name }}
      previous-tag: ${{ steps.rollback-target.outputs.tag }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ needs.prepare.outputs.frontend-url }}
    steps:
      - uses: actions/checkout@v6

      - name: Read current frontend image reference
        id: current-image
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py image-ref \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --github-output "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR for rollback validation
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate current frontend rollback target
        id: rollback-target
        env:
          NAME: ${{ steps.current-image.outputs.name }}
          TAG: ${{ steps.current-image.outputs.tag }}
        run: |
          set -euo pipefail

          if docker manifest inspect "${NAME}:${TAG}" >/dev/null 2>&1; then
            echo "name=$NAME" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Frontend rollback target is valid: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Frontend rollback target ${NAME}:${TAG} does not exist in GHCR. Automatic rollback for the frontend will be skipped rather than restoring a broken image reference."
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Frontend rollback target is invalid and will be skipped: ${NAME}:${TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update frontend image reference
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          # See backend deploy comment — same effective-tag fallback rule.
          TAG="${{ needs.validate-images.outputs.effective-tag }}"
          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --image-name "${{ env.FRONTEND_IMAGE }}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Restart frontend
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    needs: [prepare, deploy-backend, deploy-frontend]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.deploy-backend.result != 'failure' &&
        needs.deploy-backend.result != 'cancelled' &&
        needs.deploy-frontend.result != 'failure' &&
        needs.deploy-frontend.result != 'cancelled'
      }}
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ needs.prepare.outputs.frontend-url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run smoke verification
        env:
          FRONTEND_URL: ${{ needs.prepare.outputs.frontend-url }}
          API_URL: ${{ needs.prepare.outputs.api-url }}
          SMOKE_ADMIN_EMAIL: ${{ secrets.SMOKE_ADMIN_EMAIL }}
          SMOKE_ADMIN_PASSWORD: ${{ secrets.SMOKE_ADMIN_PASSWORD }}
          SMOKE_COUPLE_EMAIL: ${{ secrets.SMOKE_COUPLE_EMAIL }}
          SMOKE_COUPLE_PASSWORD: ${{ secrets.SMOKE_COUPLE_PASSWORD }}
          SMOKE_PUBLIC_WEDDING_SLUG: ${{ secrets.SMOKE_PUBLIC_WEDDING_SLUG }}
        run: |
          set -euo pipefail
          ARGS=(
            --frontend-base "$FRONTEND_URL"
            --api-base "$API_URL"
            --admin-email "$SMOKE_ADMIN_EMAIL"
            --admin-password "$SMOKE_ADMIN_PASSWORD"
          )

          if [ -n "${SMOKE_PUBLIC_WEDDING_SLUG:-}" ]; then
            ARGS+=(--public-slug "$SMOKE_PUBLIC_WEDDING_SLUG")
          fi

          if [ "${{ inputs.verify_sse }}" != "true" ]; then
            ARGS+=(--skip-sse)
          fi

          if [ "${{ inputs.allow_insecure_tls }}" = "true" ]; then
            ARGS+=(--allow-insecure-tls)
          fi

          if [ "${{ inputs.verify_couple }}" = "true" ]; then
            if [ -z "${SMOKE_COUPLE_EMAIL:-}" ] || [ -z "${SMOKE_COUPLE_PASSWORD:-}" ]; then
              echo "Couple verification was requested but the staging couple smoke credentials are missing."
              exit 1
            fi
            ARGS+=(--couple-email "$SMOKE_COUPLE_EMAIL" --couple-password "$SMOKE_COUPLE_PASSWORD")
          fi

          python scripts/deploy/verify_environment.py "${ARGS[@]}"

  rollback:
    name: Roll back ${{ inputs.environment_name }}
    runs-on: ubuntu-latest
    needs: [prepare, deploy-backend, deploy-frontend, verify]
    if: failure()
    environment:
      name: ${{ inputs.environment_name }}
      url: ${{ needs.prepare.outputs.frontend-url }}
    steps:
      - uses: actions/checkout@v6

      - name: Roll back backend
        if: >-
          ${{
            needs.prepare.outputs.deploy-backend == 'true' &&
            needs.deploy-backend.outputs.previous-name != '' &&
            needs.deploy-backend.outputs.previous-tag != '' &&
            (needs.deploy-backend.result == 'failure' || needs.verify.result == 'failure')
          }}
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          NAME="${{ needs.deploy-backend.outputs.previous-name }}"
          TAG="${{ needs.deploy-backend.outputs.previous-tag }}"
          if [ -z "$NAME" ]; then
            echo "Missing recorded backend rollback image name."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "Missing recorded backend rollback tag."
            exit 1
          fi

          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --image-name "${NAME}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_BACKEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Roll back frontend
        if: >-
          ${{
            needs.prepare.outputs.deploy-frontend == 'true' &&
            needs.deploy-frontend.outputs.previous-name != '' &&
            needs.deploy-frontend.outputs.previous-tag != '' &&
            (needs.deploy-frontend.result == 'failure' || needs.verify.result == 'failure')
          }}
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          NAME="${{ needs.deploy-frontend.outputs.previous-name }}"
          TAG="${{ needs.deploy-frontend.outputs.previous-tag }}"
          if [ -z "$NAME" ]; then
            echo "Missing recorded frontend rollback image name."
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "Missing recorded frontend rollback tag."
            exit 1
          fi

          python3 scripts/deploy/coolify_api.py set-image \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --image-name "${NAME}" \
            --image-tag "${TAG}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

          python3 scripts/deploy/coolify_api.py restart \
            --uuid "${{ secrets.COOLIFY_FRONTEND_UUID }}" \
            --summary-file "$GITHUB_STEP_SUMMARY"
