# =============================================================================
# CD Pipeline - Deploy to DigitalOcean Kubernetes (DOKS)
# Triggers after CI builds complete on main
# =============================================================================
name: Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to DOKS
    runs-on: ubuntu-latest
    # Only deploy if CI succeeded (or manual trigger)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: production
      url: https://thespecialwedding.io
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image-tag }}" >> $GITHUB_OUTPUT
          else
            # Use the short SHA from the CI run that triggered this
            SHA="${{ github.event.workflow_run.head_sha }}"
            echo "tag=${SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Update image tags in kustomization
        run: |
          cd k8s/overlays/production
          kustomize edit set image \
            ghcr.io/etastic/wedding-app-backend:${{ steps.tag.outputs.tag }} \
            ghcr.io/etastic/wedding-app-frontend:${{ steps.tag.outputs.tag }}

      - name: Deploy to Kubernetes
        run: kubectl apply -k k8s/overlays/production

      - name: Wait for backend rollout
        run: |
          echo "Waiting for backend deployment to complete..."
          kubectl rollout status deployment/backend \
            --namespace=wedding-app \
            --timeout=180s

      - name: Wait for frontend rollout
        run: |
          echo "Waiting for frontend deployment to complete..."
          kubectl rollout status deployment/frontend \
            --namespace=wedding-app \
            --timeout=120s

      - name: Health check - Frontend
        run: |
          max_retries=5
          retry_delay=15
          for i in $(seq 1 $max_retries); do
            echo "Frontend health check attempt $i/$max_retries..."
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "https://thespecialwedding.io" || echo "000")
            if [ "$status" -eq 200 ]; then
              echo "Frontend is healthy (HTTP 200)"
              break
            fi
            if [ "$i" -eq "$max_retries" ]; then
              echo "Frontend health check failed"
              exit 1
            fi
            echo "Got HTTP $status, retrying in ${retry_delay}s..."
            sleep $retry_delay
          done

      - name: Health check - Backend API
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 10 \
            "https://api.thespecialwedding.io/health/readyz" || echo "000")
          if [ "$status" -eq 200 ]; then
            echo "Backend API is healthy and ready"
          else
            echo "WARNING: Backend returned HTTP $status"
            exit 1
          fi

  # ── Auto-rollback on deploy failure ────────────────────────────────────────
  rollback:
    name: Auto-Rollback
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Configure kubectl
        run: doctl kubernetes cluster kubeconfig save ${{ secrets.DOKS_CLUSTER_NAME }}

      - name: Rollback deployments
        run: |
          echo "Deploy failed — rolling back to previous version..."
          kubectl rollout undo deployment/backend --namespace=wedding-app
          kubectl rollout undo deployment/frontend --namespace=wedding-app
          kubectl rollout status deployment/backend --namespace=wedding-app --timeout=120s
          kubectl rollout status deployment/frontend --namespace=wedding-app --timeout=120s
          echo "Rollback complete"

      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha || 'unknown';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy failed & auto-rolled back: ${sha.substring(0, 7)}`,
              body: `## Deploy Failure (Auto-Rolled Back)\n\n- **Commit:** ${sha}\n- **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n- **Action taken:** Automatic rollback to previous version\n\nThe production site is still running on the previous deployment. Please investigate before re-deploying.`,
              labels: ['bug', 'deploy-failure', 'rollback']
            });
